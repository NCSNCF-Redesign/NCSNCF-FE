<style>
  /* Aggressively hide the layout's auto-generated header block, preserving the masthead navigation */
  .page-header, .page__header, .entry-header, .page-title { 
    display: none !important; 
  }
</style>

<!-- Community Survey Component -->
<div class="ocs__card ocs__mb-8" style="margin-top: 2rem;">
  <h2 class="ocs__title ocs__title--lg ocs__mb-2">Website & Community Survey</h2>
  <p class="ocs__description ocs__mb-6">This survey will help identify ways to improve the North County Special Needs Community Foundation website so visitors can more easily find information, discover opportunities, access resources, and get involved.</p>

  <form id="ncsncfSurveyForm" class="ocs__form">
      
      <!-- 1. Discovery Source -->
      <div class="ocs__form-group">
          <label for="ncsncfDiscovery" class="ocs__label">
              1. How did you first hear about the North County Special Needs Community Foundation?
          </label>
          <select id="ncsncfDiscovery" name="discovery" class="ocs__select">
              <option value="" disabled selected>Select an option</option>
              <option value="Social media">Social media</option>
              <option value="Friends or family">Friends or family</option>
              <option value="School or teacher">School or teacher</option>
              <option value="Search engine">Search engine (Google, etc.)</option>
              <option value="Community event">Community event</option>
              <option value="Healthcare provider or support organization">Healthcare provider or support organization</option>
              <option value="Advertisement">Advertisement</option>
              <option value="Other">Other</option>
              <option value="I haven't heard of the foundation before">I haven't heard of the foundation before</option>
          </select>
      </div>

      <!-- 2. Visit Frequency -->
      <div class="ocs__form-group">
          <label for="ncsncfFrequency" class="ocs__label">
              2. How often do you visit the foundation's website?
          </label>
          <select id="ncsncfFrequency" name="visitFrequency" class="ocs__select">
              <option value="" disabled selected>Select frequency</option>
              <option value="This is my first visit">This is my first visit</option>
              <option value="Less than once a month">Less than once a month</option>
              <option value="Once a month">Once a month</option>
              <option value="Several times a month">Several times a month</option>
              <option value="Once a week or more">Once a week or more</option>
          </select>
      </div>

      <!-- 3. Information & Opportunities (Checkboxes) -->
      <div class="ocs__form-group">
          <label class="ocs__label ocs__mb-2">
              3. What information or opportunities are you most interested in finding on the website? (Select all that apply)
          </label>
          <div class="ocs__checkbox-grid">
              <label class="ocs__checkbox-label"><input type="checkbox" name="interestedInfo" value="Down syndrome information and resources" class="ocs__checkbox"> <span>Down syndrome information and resources</span></label>
              <label class="ocs__checkbox-label"><input type="checkbox" name="interestedInfo" value="Programs and activities for individuals with developmental disabilities" class="ocs__checkbox"> <span>Programs and activities</span></label>
              <label class="ocs__checkbox-label"><input type="checkbox" name="interestedInfo" value="Family support and community connections" class="ocs__checkbox"> <span>Family support</span></label>
              <label class="ocs__checkbox-label"><input type="checkbox" name="interestedInfo" value="Educational opportunities" class="ocs__checkbox"> <span>Educational opportunities</span></label>
              <label class="ocs__checkbox-label"><input type="checkbox" name="interestedInfo" value="Independent living and housing resources" class="ocs__checkbox"> <span>Housing resources</span></label>
              <label class="ocs__checkbox-label"><input type="checkbox" name="interestedInfo" value="Volunteer opportunities" class="ocs__checkbox"> <span>Volunteer opportunities</span></label>
              <label class="ocs__checkbox-label"><input type="checkbox" name="interestedInfo" value="Fundraising and donation opportunities" class="ocs__checkbox"> <span>Donations</span></label>
              <label class="ocs__checkbox-label"><input type="checkbox" name="interestedInfo" value="Community events" class="ocs__checkbox"> <span>Community events</span></label>
              <label class="ocs__checkbox-label"><input type="checkbox" name="interestedInfo" value="Other" class="ocs__checkbox"> <span>Other</span></label>
          </div>
      </div>

      <!-- 4. Community Connection -->
      <div class="ocs__form-group">
          <label for="ncsncfConnection" class="ocs__label">
              4. What is your connection to the special needs community?
          </label>
          <select id="ncsncfConnection" name="communityConnection" class="ocs__select">
              <option value="" disabled selected>Select an option</option>
              <option value="Individual with Down syndrome or another developmental disability">Individual with Down syndrome or another developmental disability</option>
              <option value="Parent or caregiver">Parent or caregiver</option>
              <option value="Family member or friend">Family member or friend</option>
              <option value="Teacher or education professional">Teacher or education professional</option>
              <option value="Healthcare or support professional">Healthcare or support professional</option>
              <option value="Volunteer or community supporter">Volunteer or community supporter</option>
              <option value="Student researching the topic">Student researching the topic</option>
              <option value="Other">Other</option>
              <option value="Prefer not to say">Prefer not to say</option>
          </select>
      </div>

      <!-- 5. Main Reason -->
      <div class="ocs__form-group">
          <label for="ncsncfMainReason" class="ocs__label">
              5. What is your main reason for visiting the foundation's website?
          </label>
          <select id="ncsncfMainReason" name="mainReason" class="ocs__select">
              <option value="" disabled selected>Select primary reason</option>
              <option value="Finding resources or support">Finding resources or support</option>
              <option value="Learning about Down syndrome or developmental disabilities">Learning about Down syndrome or developmental disabilities</option>
              <option value="Finding programs and activities">Finding programs and activities</option>
              <option value="Connecting with other families">Connecting with other families</option>
              <option value="Exploring volunteer opportunities">Exploring volunteer opportunities</option>
              <option value="Donating or fundraising">Donating or fundraising</option>
              <option value="Learning about the foundation's mission">Learning about the foundation's mission</option>
              <option value="School or educational research">School or educational research</option>
              <option value="Other">Other</option>
          </select>
      </div>

      <!-- 6. Improvements Feedback -->
      <div class="ocs__form-group">
          <label for="ncsncfImprovements" class="ocs__label">
              6. What is one thing you would improve about the foundation's website?
          </label>
          <textarea id="ncsncfImprovements" name="improvements" rows="3" placeholder="Share your suggestions..." class="ocs__textarea"></textarea>
      </div>

      <!-- Submit Action -->
      <div class="ocs__flex-end">
          <button type="button" id="saveNcsncfPreferencesBtn" class="ocs__btn ocs__btn--primary">
              Submit Survey
          </button>
      </div>
      <p id="ncsncfStatus" class="ocs__status-message ocs__hidden"></p>
  </form>
</div>

<script type="module">
  import { pythonURI, fetchOptions } from '{{site.baseurl}}/assets/js/api/config.js';
  import { showToast } from "{{site.baseurl}}/assets/js/aesthetihawk/shared/toastHandler.js";

  // Submit Survey Responses
  async function saveNcsncfPreferences() {
      const getCheckedValues = (name) => Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(el => el.value);

      const discovery = document.getElementById('ncsncfDiscovery')?.value;
      const frequency = document.getElementById('ncsncfFrequency')?.value;
      const interestedInfo = getCheckedValues('interestedInfo');
      const communityConnection = document.getElementById('ncsncfConnection')?.value;
      const mainReason = document.getElementById('ncsncfMainReason')?.value;
      const improvements = document.getElementById('ncsncfImprovements')?.value;

      const statusEl = document.getElementById('ncsncfStatus');

      if (!discovery || !frequency || !mainReason) {
          alert("Please answer the required questions (Discovery, Frequency, and Main Reason) before submitting.");
          return;
      }

      const payload = {
          organization: "North County Special Needs Community Foundation",
          discovery_source: discovery,
          visit_frequency: frequency,
          interested_info: interestedInfo,
          community_connection: communityConnection || "Unspecified",
          main_reason: mainReason,
          improvements_feedback: improvements || ""
      };

      try {
          const response = await fetch(`${pythonURI}/api/profile/ncsncf`, {
              ...fetchOptions,
              method: 'POST',
              credentials: 'include',
              headers: {
                  ...(fetchOptions?.headers || {}),
                  'Content-Type': 'application/json'
              },
              body: JSON.stringify(payload)
          });

          if (!response.ok) {
              const errData = await response.json().catch(() => ({}));
              throw new Error(errData.message || `Server returned HTTP status ${response.status}`);
          }

          document.getElementById('ncsncfSurveyForm')?.reset();

          showToast({
              message: "Thank you! Your survey responses have been saved.",
              duration: 3000
          });

      } catch (error) {
          console.error('Error saving NCSNCF preferences:', error);
          if (statusEl) {
              statusEl.textContent = `Failed to save survey: ${error.message}`;
              statusEl.className = "ocs__status-message ocs__text-danger";
              statusEl.classList.remove('ocs__hidden');
          }
      }
  }

  document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('saveNcsncfPreferencesBtn');
      if (btn) btn.addEventListener('click', saveNcsncfPreferences);
  });
</script>
