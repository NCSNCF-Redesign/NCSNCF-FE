<footer id="masterFooter" class="site-footer h-card">
    <data class="u-url" href="{{ '/' | relative_url }}"></data>

    <!-- Email subscription and event reminders -->
    {% unless page.url == '/subscribe/' %}
        {% include ncsncf/subscribe.html %}
    {% endunless %}

    <!-- Existing footer navigation -->
    <div class="footer-links">

        <div class="footer-previous">
            {% unless page.footer.previous == nil %}
                <a class="footer-navigation footer-previous-link"
                   href="{{ page.footer.previous | relative_url }}">

                    <button class="footer-previous-btn medium filledTinted primary">
                        ← Previous Page
                    </button>

                </a>
            {% endunless %}
        </div>

        <div class="footer-home">
            {% unless page.footer.home == nil %}
                <a class="footer-navigation footer-home-link"
                   href="{{ page.footer.home | relative_url }}">

                    <button class="footer-home-btn medium filledTinted primary">
                        🏠︎ Home Page
                    </button>

                </a>
            {% endunless %}
        </div>

        <div class="footer-next">
            {% unless page.footer.next == nil %}
                <a class="footer-navigation footer-next-link"
                   href="{{ page.footer.next | relative_url }}">

                    <button class="footer-next-btn medium filledTinted primary">
                        → Next Page
                    </button>

                </a>
            {% endunless %}
        </div>

    </div>

</footer>
