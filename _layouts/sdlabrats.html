<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title | default: "North County Special Needs Community Foundation" }}</title>
  <meta name="theme-color" content="#0E1B33">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/projects/sdlabrats/favicon-32.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/projects/sdlabrats/main.css' | relative_url }}">
</head>
<body class="labrats">
  <script>try{var t=localStorage.getItem("labrats-theme");if(t==="light"||t==="dark")document.body.dataset.theme=t}catch(e){}</script>
  <a class="labrats__skip" href="#main">Skip to content</a>
  
  <div class="labrats__announcement">
    <div class="labrats__wrap labrats__announcement-row">
      <p>Building Opportunities in Poway & North County San Diego &bull; <a href="{{ '/donate/' | relative_url }}">Support the Monte Vista Housing Initiative &rarr;</a></p>
    </div>
  </div>

  {% include projects/sdlabrats/header.html %}

  <main id="main">
    <div class="labrats__wrap labrats__body">
      {{ content }}
    </div>
  </main>

  {% include projects/sdlabrats/footer.html %}
</body>
</html>
