
# ==========================================
# NCSNCF Frontend - Site Configuration
# ==========================================

# Site settings
title: NCSNCF Frontend
description: "North County Special Needs Community Foundation"
owner_name: Tristan Chiu, Barbara Zhao, Pranay Kamath, Raymond Liu
github_username: tristan-chiu0
github_repo: "NCSNCF-FE"

# ==========================================
# GitHub Pages Configuration
# ==========================================

url: ncsncf.opencodingsociety.com
baseurl: "/NCSNCF-FE"
future: true
incremental: true

# ==========================================
# Jekyll Build Settings
# ==========================================

remote_theme: jekyll/minima

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

# ==========================================
# Default Layout
# ==========================================

defaults:
  - scope:
      path: ""
    values:
      layout: default

# ==========================================
# Sass Configuration
# ==========================================

sass:
  sass_dir: _sass
  style: compressed

# ==========================================
# Centralized Navigation Menu
# ==========================================

navigation:
  - title: Home
    url: /

  - title: About Us
    url: /about/

  - title: Event Calendar
    url: /calendar/

  - title: Gallery
    url: /gallery/

  - title: Login
    url: /login

# ==========================================
# Minima Theme Settings
# ==========================================

minima:
  skin: classic

  social_links:
    - platform: instagram
      user_url: "https://www.instagram.com/ncspecialneedsfoundation/"

    - platform: facebook
      user_url: "https://www.facebook.com/North-County-Special-Needs-Community-Foundation-113636564660105/"

  nav_pages:
    - navigation/about.md
    - calendar.html
    - gallery.html

# ==========================================
# Excluded Files
# ==========================================

exclude:
  - vendor
  - _vendor
  - Gemfile
  - Gemfile.lock
  - Makefile
  - README.md
