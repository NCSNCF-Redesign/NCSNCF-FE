layout: post
title: Event Calendar
permalink: /calendar/
---

<style>
  .calendar-filters {
    margin-bottom: 25px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .filter-btn {
    padding: 10px 18px;
    border-radius: 8px;
    border: 2px solid #FFFFFF;
    background-color: transparent;
    color: #FFFFFF;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .filter-btn:hover, .filter-btn.active {
    background-color: #FFFFFF;
    color: #604140;
  }
  .event-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    padding: 10px 0 30px;
  }
  .event-card {
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 20px;
    border-radius: 10px;
    background-color: #604140;
    color: #FFFFFF;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }
  .event-card h3 {
    margin-top: 0;
    margin-bottom: 8px;
    color: #FFFFFF;
    font-size: 1.25rem;
  }
  .event-card .event-meta {
    color: #f7eedf;
    font-size: 0.95rem;
    margin-bottom: 10px;
  }
  .event-card .event-desc {
    color: #FFFFFF;
    font-size: 0.95rem;
    line-height: 1.5;
    margin: 0;
  }
</style>

<div style="margin-bottom: 2rem;">
  <h1 style="color: #FFFFFF; margin-bottom: 0.5rem;">Foundation &amp; Community Events</h1>
  <p style="color: #f7eedf; font-size: 1.1rem; line-height: 1.6; max-width: 800px;">
    Join us for Poway Padres softball practices, caregiver retreats, social celebrations, and informational housing workshops throughout North County.
  </p>
</div>

<section id="event-calendar">
  <!-- Filter Buttons -->
  <div class="calendar-filters">
    <button class="filter-btn active" data-category="All">All Events</button>
    <button class="filter-btn" data-category="Athletics">Athletics</button>
    <button class="filter-btn" data-category="Housing">Housing</button>
    <button class="filter-btn" data-category="Social">Social</button>
    <button class="filter-btn" data-category="Education">Education</button>
  </div>

  <!-- Event Grid -->
  <div class="event-grid" id="event-grid">
    <!-- JavaScript will inject cards here -->
  </div>
</section>

<script>
  // 1. DATA ABSTRACTION: Foundation Events List with graceful fallback
  const FALLBACK_EVENTS = [
    {
      title: "Poway Padres Softball Weekly Practice",
      category: "Athletics",
      date: "Every Saturday, 10:00 AM",
      location: "Poway Community Park",
      description: "Weekly softball practice, batting drills, and team camaraderie for Special Olympics athletes, coaches, and families.",
      capacity: 35
    },
    {
      title: "Monte Vista Housing Project Community Briefing",
      category: "Housing",
      date: "October 18, 2026",
      location: "Poway City Hall / Virtual",
      description: "Status update on the 60-unit affordable independent living community opening in Fall 2025 in Poway.",
      capacity: 100
    },
    {
      title: "Annual 2-Night Family Caregiver Retreat",
      category: "Social",
      date: "November 14-16, 2026",
      location: "Julian, CA",
      description: "Foundation-sponsored weekend getaway providing rest, peer connection, and renewal for dedicated family caregivers.",
      capacity: 20
    },
    {
      title: "Post-Secondary Vocational Skills Workshop",
      category: "Education",
      date: "December 5, 2026",
      location: "North County Regional Learning Center",
      description: "Interactive session exploring workplace readiness, job coaching opportunities, and interview confidence for young adults.",
      capacity: 25
    },
    {
      title: "NCSNCF Community Holiday Social",
      category: "Social",
      date: "December 19, 2026",
      location: "Old Poway Park",
      description: "Annual holiday celebration with food, music, team awards, and community fellowship for all athletes and families.",
      capacity: 150
    },
    {
      title: "Navigating SDRC & Supported Living Options",
      category: "Education",
      date: "January 16, 2027",
      location: "Poway Library Community Hall",
      description: "Informational workshop covering San Diego Regional Center service plans, SLS agencies, and transition planning.",
      capacity: 40
    }
  ];

  let eventList = [];

  const BACKEND_URL = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
    ? "http://localhost:8587"
    : "https://ccae-be.onrender.com";

  async function fetchEvents() {
    try {
      const response = await fetch(`${BACKEND_URL}/api/events`, {
        method: 'GET',
        headers: { 'Accept': 'application/json' }
      });
      
      if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
      const data = await response.json();
      
      if (Array.isArray(data) && data.length > 0) {
        eventList = data;
      } else {
        eventList = FALLBACK_EVENTS;
      }
    } catch (error) {
      console.warn("Backend unavailable, using Foundation event catalog:", error);
      eventList = FALLBACK_EVENTS;
    }
    
    filterEvents("All");
  }

  // 2. PROCEDURAL ABSTRACTION & ALGORITHM: Filter and render
  function filterEvents(selectedCategory) {
    const grid = document.getElementById("event-grid");
    if (!grid) return;
    grid.innerHTML = "";

    const filtered = eventList.filter(item => {
      if (selectedCategory === "All") return true;
      return item.category && item.category.toLowerCase() === selectedCategory.toLowerCase();
    });

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="event-card" style="grid-column: 1 / -1; text-align: center;">No scheduled events in "${selectedCategory}". Check back soon!</div>`;
      return;
    }

    filtered.forEach(evt => {
      const card = document.createElement("div");
      card.className = "event-card";
      card.innerHTML = `
        <h3>${evt.title}</h3>
        <p class="event-meta">
          <strong>Category:</strong> ${evt.category || 'General'} | <strong>Date:</strong> ${evt.date || 'TBD'}
          ${evt.location ? '<br><strong>Location:</strong> ' + evt.location : ''}
        </p>
        <p class="event-desc">${evt.description || 'Join our community for friendship, learning, and celebration.'}</p>
      `;
      grid.appendChild(card);
    });
  }

  // 3. CAPTURING INPUT: Category button toggling
  const buttons = document.querySelectorAll('.filter-btn');
  buttons.forEach(button => {
    button.addEventListener('click', function() {
      buttons.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      const category = this.getAttribute('data-category');
      filterEvents(category);
    });
  });

  document.addEventListener("DOMContentLoaded", fetchEvents);
</script>
